name: Update README

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  markscribe:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions-go/go-install@main
        id: install
        with:
          module: github.com/taciturnaxolotl/markscribe@HEAD

      - name: generate readme
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          WAKATIME_URL: ${{ secrets.WAKATIME_URL }}
        run: ${{ steps.install.outputs.install-path }} -write README.md github.tpl

      - name: commit
        env:
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add README.md
          git diff --cached --quiet && exit 0

          if [ "$(git log -1 --format=%ae)" = "$BOT_EMAIL" ]; then
            git commit --amend --no-edit --reset-author
            git push --force-with-lease origin HEAD:main
          else
            git commit -m "Update generated README"
            git push origin HEAD:main
          fi
